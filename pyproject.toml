[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cidrkit"
version = "0.1.0"
description = "Everyday subnet math on the command line: info, split, merge, contains, range, exclude. IPv4 and IPv6."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["cidr", "subnet", "ip", "network", "calculator", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: System :: Networking",
]

[project.scripts]
cidrkit = "cidrkit.cli:main"

[tool.setuptools]
packages = ["cidrkit"]
